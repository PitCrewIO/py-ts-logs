[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "py-ts-logs"
version = "0.1.0"
description = "Python library for parsing EFI Analytics TunerStudio MLG binary log files"
readme = "README.md"
license = "LICENSE"
packages = [{ include = "ts_logs" }]

[tool.poetry.dependencies]
python = ">=3.8"
typing_extensions = ">=4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
